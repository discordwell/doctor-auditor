version: "3.8"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://doctor_auditor:doctor_auditor@db:5432/doctor_auditor
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - server

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doctor_auditor
      POSTGRES_PASSWORD: doctor_auditor
      POSTGRES_DB: doctor_auditor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctor_auditor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
